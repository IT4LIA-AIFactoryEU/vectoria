name: "Help wanted (maintainers)"
description: "Define a task for which the project is requesting community contributions."
title: "[HELP WANTED] "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        This form is intended primarily for maintainers and collaborators requesting external contributions.

  - type: textarea
    id: task
    attributes:
      label: "Requested contribution"
      description: "Describe the work to be completed and the expected outcome."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Why help is needed"
      description: "Explain the context and why an external contribution would be useful."
    validations:
      required: true

  - type: textarea
    id: useful-skills
    attributes:
      label: "Useful skills or knowledge"
      placeholder: "For example: Python, accessibility, Docker, technical writing"
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: contributor-references
    attributes:
      label: "Contributor references"
      description: "List relevant files, documentation, tests, related issues, or architecture decisions."
    validations:
      required: false

  - type: checkboxes
    id: maintainer-support
    attributes:
      label: "Maintainer support"
      options:
        - label: "A maintainer is available to answer questions and review the pull request."
          required: false
